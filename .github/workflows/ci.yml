name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck backend
        working-directory: packages/backend
        run: bunx tsc -p convex --noEmit

      - name: Test backend
        working-directory: packages/backend
        run: |
          bun test tests convex/lockedPolicy.test.ts
          bunx vitest run

      # next-env.d.ts and the route types are generated, not committed.
      - name: Typecheck web app
        working-directory: apps/v2
        run: |
          bunx next typegen
          bunx tsc --noEmit
