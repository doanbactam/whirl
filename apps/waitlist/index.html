<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    />

    <title>Whirl — The first AI Chat app that actually cares about you</title>
    <meta
      name="description"
      content="The first AI Chat app that actually cares about you. Join the waitlist."
    />
    <!-- The waitlist is retired — whirl.chat now serves the app. Keep this page
         out of search so the old "Join the waitlist" listing stops appearing. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://whirl.chat" />
    <meta name="theme-color" content="#F3F3F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Whirl" />
    <meta property="og:title" content="Whirl — The first AI Chat app that actually cares about you" />
    <meta
      property="og:description"
      content="The first AI Chat app that actually cares about you. Join the waitlist."
    />
    <meta property="og:image" content="/whirl-og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Whirl — The first AI Chat app that actually cares about you" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Whirl — The first AI Chat app that actually cares about you" />
    <meta
      name="twitter:description"
      content="The first AI Chat app that actually cares about you. Join the waitlist."
    />
    <meta name="twitter:image" content="/whirl-og.png" />
    <meta name="twitter:image:alt" content="Whirl — The first AI Chat app that actually cares about you" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (
          t === "dark" ||
          ((t === "system" || !t) &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
